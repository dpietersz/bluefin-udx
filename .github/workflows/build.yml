name: build

on:
  schedule:
    - cron: "20 4 * * *"   # 04:20 UTC daily — picks up upstream Bluefin-DX bumps
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "scripts/**"
      - "files/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - bluefin-udx
          - bluefin-udx-nvidia

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ----------------------------------------------------------------------
      # Maximize free disk on the runner — Bluefin DX base + our adds easily
      # blow past the default 14GB free. uBlue uses this pattern everywhere.
      # ----------------------------------------------------------------------
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      # ----------------------------------------------------------------------
      # Install bluebuild CLI directly so we can drive build/push as separate
      # steps and insert a smoke-boot gate between them.
      # ----------------------------------------------------------------------
      - name: Install bluebuild CLI
        run: |
          set -euo pipefail
          INSTALLER_IMG="ghcr.io/blue-build/cli:latest-installer"
          CID=$(docker create "$INSTALLER_IMG" /bin/true)
          docker cp "$CID:/out/bluebuild" /usr/local/bin/bluebuild
          docker rm "$CID" >/dev/null
          chmod +x /usr/local/bin/bluebuild
          bluebuild --version

      # ----------------------------------------------------------------------
      # BUILD LOCALLY — no push, no sign.
      # We use `bluebuild generate` (which emits a plain Containerfile) then
      # build it with `docker buildx build --load`, which puts the image
      # directly into the docker store. This avoids the docker-container
      # buildx driver's "no output specified" behavior that bluebuild build
      # triggers by default.
      # ----------------------------------------------------------------------
      - name: Generate Containerfile
        run: |
          set -euo pipefail
          bluebuild generate \
            --registry "${IMAGE_REGISTRY}" \
            --registry-namespace "${{ github.repository_owner }}" \
            -o Containerfile.generated \
            "recipes/${{ matrix.recipe }}.yml"
          echo "=== Containerfile head ==="
          head -30 Containerfile.generated

      - name: Build with docker buildx (load into docker store)
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            -t "localhost/${{ matrix.recipe }}:latest" \
            -f Containerfile.generated \
            .
          echo "Images in local docker store after build:"
          docker images --format "{{.Repository}}:{{.Tag}}" | head -20

      # ----------------------------------------------------------------------
      # SMOKE-BOOT GATE.
      # Boot the just-built image, verify expected binaries + config files.
      # ----------------------------------------------------------------------
      - name: Smoke-boot test
        id: smoke
        run: |
          set -euo pipefail
          IMAGE="localhost/${{ matrix.recipe }}:latest"
          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "FAIL: $IMAGE not in docker store"
            docker images
            exit 1
          fi
          echo "Smoke-testing $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          docker run --rm --entrypoint /bin/bash "$IMAGE" -c '
            set -e
            FAIL=0
            check_bin() {
                if command -v "$1" >/dev/null 2>&1; then echo "  ok    $1"; else echo "  MISS  $1"; FAIL=1; fi
            }
            check_file() {
                if [ -e "$1" ]; then echo "  ok    $1"; else echo "  MISS  $1"; FAIL=1; fi
            }
            check_rpm() {
                if rpm -q "$1" >/dev/null 2>&1; then echo "  ok    rpm $1"; else echo "  MISS  rpm $1"; FAIL=1; fi
            }
            echo "Phase 0 bootstrap binaries:"
            for bin in pass gpg age ssh git jq curl; do check_bin "$bin"; done
            # Bluefin /opt -> /var/opt (first-boot populated). Inside docker/podman
            # run the runtime symlink chain dead-ends; verify rpm + real path instead.
            echo "Phase 0 Teams:"
            check_rpm teams-for-linux
            check_file /usr/lib/opt/teams-for-linux/teams-for-linux
            check_file /usr/lib/opt/teams-for-linux/teams-for-linux.real
            check_file /etc/teams-for-linux/config.json.default
            exit $FAIL
          '

      # ----------------------------------------------------------------------
      # Push (only on main, only after smoke-boot passed).
      # ----------------------------------------------------------------------
      - name: Log in to ghcr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase registry
        id: regcase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Tag and push to ghcr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: push
        run: |
          set -euo pipefail
          SRC="${{ steps.smoke.outputs.image }}"
          REG="${{ steps.regcase.outputs.lowercase }}"
          NAME="${{ matrix.recipe }}"
          DATE_TAG="$(date -u +%Y%m%d)"
          SHA_TAG="${GITHUB_SHA::7}"

          # Always push :stable + a dated tag + a sha tag (rollback targets).
          for TAG in stable "$DATE_TAG" "$SHA_TAG"; do
            DEST="${REG}/${NAME}:${TAG}"
            docker tag "$SRC" "$DEST"
            docker push "$DEST"
            echo "pushed $DEST"
          done

          # Capture the digest of the :stable tag for cosign signing.
          DIGEST=$(docker inspect "${REG}/${NAME}:stable" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')
          echo "image_ref=${REG}/${NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Will sign: ${REG}/${NAME}@${DIGEST}"

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "WARN: SIGNING_SECRET not set; image pushed unsigned."
            exit 0
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}"
          echo "signed ${IMAGE_REF}"
