name: build

on:
  schedule:
    - cron: "20 4 * * *"   # 04:20 UTC daily — picks up upstream Bluefin-DX bumps
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "scripts/**"
      - "files/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-24.04
    # A green build is ~20 min. The default 6h ceiling let the 2026-08-20 run
    # burn a full six hours on one leg before reporting; cap it so a storage or
    # toolchain regression costs minutes, not a whole night.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - bluefin-udx
          - bluefin-udx-nvidia

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Audit COPR package freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/audit-copr-freshness.sh

      # ----------------------------------------------------------------------
      # Disk cleanup. RAM (16 GB ceiling on ubuntu-24.04 hosted runners), not
      # disk, is the actual constraint — see commit log for the buildx→podman
      # switch below. We keep ublue-os/remove-unwanted-software@v7 anyway for
      # the small headroom it gives, and log df for visibility.
      # ----------------------------------------------------------------------
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Disk space after cleanup
        run: df -h /

      # ----------------------------------------------------------------------
      # Runner image 20260810.271.1 replaced Ubuntu's Podman 4.9.3 with a
      # third-party static Podman 5.8.4 bundle (mgoltzsche/podman-static). The
      # bundle untars its own /etc over the host, landing a storage.conf with:
      #     mount_program = "/usr/local/bin/fuse-overlayfs"
      #     mountopt      = "nodev,fsync=0"
      # That is graphroot-wide, so it hits ROOTFUL podman too. Two consequences,
      # both fatal for a bootc build:
      #
      #  1. containers/storage sets useNaiveDiffOnly as soon as a mount_program
      #     is in play, and every layer then commits through FUSE. Measured by
      #     this repo's own probe workflow (run 32368262988): ONE trivial layer
      #     on a bluefin-dx base took 663s through fuse-overlayfs vs 66s on
      #     kernel overlay. Across 34 layers x 3 build attempts, that is the six
      #     hours the 2026-08-20 nightly burned before being killed.
      #  2. fuse-overlayfs 1.16 (predates the 1.17 "st_ino must be unique" fix)
      #     plus fsync=0 intermittently corrupts the ~90 MB rpmdb.sqlite
      #     inherited from the base image, surfacing as "database disk image is
      #     malformed" / "Error -1 running transaction". Same signature and same
      #     Fedora-bootc workload as containers/fuse-overlayfs#475 and
      #     actions/runner-images#14597.
      #
      # Deleting the bundle is NOT sufficient, and configuration alone CANNOT
      # fix this. Two independent routes lead back to FUSE:
      #   - /usr/bin/fuse-overlayfs ships on the image as well, and
      #     overlay.Init() resolves it with a bare exec.LookPath(), no path
      #     constraint. Removing only the /usr/local/bin copy (which is what the
      #     first attempt at this fix did) leaves that one in place.
      #   - the VM image ships a graphroot already initialised under the bundle
      #     config. /var/lib/containers/storage/overlay/.has-mount-program is
      #     baked in reading "true", and SupportsNativeOverlay() honours that
      #     file and returns false WITHOUT probing the kernel, so podman
      #     re-adopts fuse-overlayfs from PATH. Verified on a pristine runner:
      #     the file exists, says "true", and is dated to the image bake.
      #
      # Hence: remove BOTH fuse-overlayfs copies, wipe the graphroot, and write
      # our own storage.conf rather than inheriting whatever the next runner
      # image ships. Ordering matters -- the wipe must precede the first podman
      # call, because `podman info` itself initialises the graphroot and would
      # re-record the flag.
      #
      # Distro Podman is kept because 4.9.3 + crun 1.14.1 + kernel overlay is
      # the stack every green build through 2026-08-12 used. The bundle's
      # runtime/config files must go with it: distro Podman otherwise finds the
      # bundle's /usr/local/lib/podman/conmon before /usr/bin/conmon, and
      # 00-fix-runtime.conf pins crun to a /usr/local/bin path we just deleted.
      # ----------------------------------------------------------------------
      - name: Pin Podman to the distro build on kernel overlay
        run: |
          set -euo pipefail

          # Remove the static bundle and every config file it planted.
          sudo rm -f /usr/local/bin/{podman,pasta,pasta.avx2,crun,fusermount3,runc}
          sudo rm -rf /usr/local/lib/podman /usr/local/libexec/podman
          sudo rm -f /etc/containers/{storage.conf,containers.conf,seccomp.json}
          sudo rm -f /etc/containers/containers.conf.d/00-fix-runtime.conf

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman
          hash -r

          # Close both routes back to FUSE. Done AFTER apt so a fuse-overlayfs
          # pulled in as a dependency is caught too; leaving the package
          # installed is fine, LookPath only cares about the binary.
          sudo rm -f /usr/local/bin/fuse-overlayfs /usr/bin/fuse-overlayfs
          sudo rm -rf /var/lib/containers/storage /run/containers/storage

          # Pin storage explicitly instead of inheriting the distro default
          # from /usr/share/containers/storage.conf.
          sudo mkdir -p /etc/containers
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"

          [storage.options.overlay]
          mountopt = "nodev"
          EOF

          if [ "$(command -v podman)" != "/usr/bin/podman" ]; then
            echo "::error::Expected distro Podman at /usr/bin/podman, got $(command -v podman)"
            exit 1
          fi
          podman --version

          if command -v fuse-overlayfs >/dev/null 2>&1; then
            echo "::error::fuse-overlayfs still resolvable at $(command -v fuse-overlayfs) - overlay.Init would re-adopt it"
            exit 1
          fi

          PODMAN_INFO=$(sudo podman info \
            --format 'runtime={{.Host.OCIRuntime.Path}} conmon={{.Host.Conmon.Path}} storage={{.Store.GraphDriverName}}')
          echo "$PODMAN_INFO"
          if [[ "$PODMAN_INFO" != *"runtime=/usr/bin/crun"* ||
                "$PODMAN_INFO" != *"conmon=/usr/bin/conmon"* ]]; then
            echo "::error::Distro Podman is still using a static-bundle component"
            exit 1
          fi
          if [[ "$PODMAN_INFO" != *"storage=overlay"* ]]; then
            echo "::error::Expected the overlay storage driver - got: $PODMAN_INFO"
            exit 1
          fi

          # The decisive assertion, and the reason it is a file read rather than
          # a podman info field: no info field can see this. GraphOptions stays
          # EMPTY when the mount program is auto-detected rather than configured,
          # and "Native Overlay Diff" reads false on these runners even on a
          # healthy kernel-overlay build -- probe run 32368262988 measured false
          # on both the 663s path and the 66s path, so asserting it would fail a
          # correct build. The flag file is the only direct signal.
          FLAG=/var/lib/containers/storage/overlay/.has-mount-program
          if [ -e "$FLAG" ] && [ "$(sudo cat "$FLAG")" = "true" ]; then
            echo "::error::containers/storage adopted a mount program - build would run through fuse-overlayfs"
            exit 1
          fi
          echo "storage: kernel overlay, no mount program"

      # ----------------------------------------------------------------------
      # Install bluebuild CLI directly so we can drive build/push as separate
      # steps and insert a smoke-boot gate between them.
      # ----------------------------------------------------------------------
      - name: Install bluebuild CLI
        run: |
          set -euo pipefail
          # sudo throughout: the build below is rootful, and running this one
          # step rootless would spin up a SECOND graphroot under $HOME with its
          # own storage config and its own .has-mount-program state, outside
          # every assertion made above. One store, one set of guarantees.
          INSTALLER_IMG="ghcr.io/blue-build/cli:latest-installer"
          CID=$(sudo podman create "$INSTALLER_IMG" /bin/true)
          sudo podman cp "$CID:/out/bluebuild" /tmp/bluebuild
          sudo podman rm "$CID" >/dev/null
          sudo install -m 0755 /tmp/bluebuild /usr/local/bin/bluebuild
          bluebuild --version

      # ----------------------------------------------------------------------
      # BUILD LOCALLY — no push, no sign.
      # `bluebuild generate` emits a plain Containerfile. We build it with
      # rootful distro `sudo podman build --jobs=1`, replacing the previous
      # `docker buildx --load` path which exhausted the runner's 16 GB RAM
      # ceiling on the bluefin-udx-nvidia leg (buildkit holds parallel
      # stages + the entire image in memory during --load materialization).
      # podman writes layers straight to overlay storage; --jobs=1 forces
      # serial stage execution so peak RAM stays low.
      # ----------------------------------------------------------------------
      # ----------------------------------------------------------------------
      # Pre-resolve external "latest" versions using GITHUB_TOKEN (1000 req/h
      # quota) BEFORE the build, write them to a pin file that the in-build
      # scripts (install-nwg-displays-latest.sh, install-nushell-latest.sh,
      # install-paseo-latest.sh, install-proton-authenticator-latest.sh,
      # install-proton-mail-latest.sh)
      # can pick up from their bluebuild script/files mounts. This avoids the
      # unauthenticated GitHub API rate limit (60/h per IP) hit on 2026-06-03 —
      # both matrix legs share the runner IP pool so the second leg's API calls
      # 403'd. Scripts still work locally without this file (falls back to
      # unauthenticated API).
      # ----------------------------------------------------------------------
      - name: Pre-resolve external versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NWG_TAG=$(gh api repos/nwg-piotr/nwg-displays/tags --jq '.[0].name')

          # atim/nushell COPR fell behind upstream. Resolve Nushell's official
          # tagged binary. Require GitHub's asset digest and upstream SHA256SUMS
          # to agree; upstream publishes no independent artifact signature.
          NUSHELL_RELEASE=$(gh api repos/nushell/nushell/releases/latest)
          NUSHELL_TAG=$(jq -r '.tag_name' <<<"$NUSHELL_RELEASE")
          NUSHELL_VERSION="${NUSHELL_TAG#v}"
          NUSHELL_ARCHIVE="nu-${NUSHELL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          NUSHELL_API_SHA256=$(jq -r --arg archive "$NUSHELL_ARCHIVE" \
            '.assets[] | select(.name == $archive) | .digest // empty' <<<"$NUSHELL_RELEASE")
          NUSHELL_API_SHA256="${NUSHELL_API_SHA256#sha256:}"
          NUSHELL_MANIFEST_SHA256=$(curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/nushell/nushell/releases/download/${NUSHELL_TAG}/SHA256SUMS" \
            | awk -v archive="$NUSHELL_ARCHIVE" '$2 == archive { print $1; exit }')
          if [[ ! "$NUSHELL_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ||
                ! "$NUSHELL_API_SHA256" =~ ^[0-9a-fA-F]{64}$ ||
                "$NUSHELL_API_SHA256" != "$NUSHELL_MANIFEST_SHA256" ]]; then
            echo "::error::Invalid or inconsistent Nushell release digests"
            exit 1
          fi
          NUSHELL_SHA256="$NUSHELL_API_SHA256"

          # Do NOT trust /releases/latest for paseo. getpaseo/paseo has shipped
          # duplicate tags with empty "latest" releases (2026-06-10: two v0.1.93
          # releases — the newer id 337050406 with 0 assets, which /releases/latest
          # resolves to, and id 337050405 carrying Paseo-0.1.93-x86_64.rpm). An
          # empty PASEO_URL writes an empty pin and the in-build script then aborts.
          # Resolve across the releases LIST instead and pick the newest stable
          # (non-draft, non-prerelease) release that ACTUALLY exposes an x86_64.rpm.
          PASEO_URL=$(gh api "repos/getpaseo/paseo/releases?per_page=100" \
            --jq '[.[] | select(.draft==false and .prerelease==false) | .assets[] | select(.name | endswith("x86_64.rpm")) | .browser_download_url][0] // empty')
          if [ -z "$PASEO_URL" ] || [ "$PASEO_URL" = "null" ]; then
            echo "::error::No getpaseo/paseo release exposes an x86_64.rpm asset — aborting before writing an empty pin"
            exit 1
          fi

          # Proton ships no DNF repository. Resolve the newest active stable
          # x86_64 RPM and its SHA-512 from the official manifest. Keeping these
          # values in build-pins.env makes a Proton release change invalidate the
          # cached script layer on the next nightly build.
          PROTON_RELEASE=$(curl -fsSL --retry 5 --retry-all-errors \
            https://proton.me/download/authenticator/linux/version.json \
            | jq -r '
                [
                  .Releases[]
                  | select(.CategoryName == "Stable" and (.RolloutPercentage // 0) > 0)
                  | . as $release
                  | .File[]
                  | select(.Identifier | startswith(".rpm"))
                  | [$release.Version, .Url, .Sha512CheckSum]
                ][0] // empty
                | @tsv
              ')
          if [ -z "$PROTON_RELEASE" ]; then
            echo "::error::No active stable Proton Authenticator RPM in official manifest"
            exit 1
          fi
          IFS=$'\t' read -r PROTON_VERSION PROTON_URL PROTON_SHA512 <<< "$PROTON_RELEASE"
          if [[ ! "$PROTON_VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ||
                ! "$PROTON_URL" =~ ^https://proton\.me/download/authenticator/linux/ProtonAuthenticator-[0-9]+(\.[0-9]+)+-[0-9]+\.x86_64\.rpm$ ||
                ! "$PROTON_SHA512" =~ ^[0-9a-fA-F]{128}$ ]]; then
            echo "::error::Invalid Proton Authenticator version, URL, or SHA-512 in official manifest"
            exit 1
          fi

          # Proton Mail uses a separate manifest and rollout field. Select only
          # Stable: the first entry can be Alpha or EarlyAccess even when a newer
          # version number exists.
          PROTON_MAIL_RELEASE=$(curl -fsSL --retry 5 --retry-all-errors \
            https://proton.me/download/mail/linux/version.json \
            | jq -r '
                [
                  .Releases[]
                  | select(.CategoryName == "Stable" and (.RolloutProportion // 0) > 0)
                  | . as $release
                  | .File[]
                  | select(.Identifier | startswith(".rpm"))
                  | [$release.Version, .Url, .Sha512CheckSum]
                ][0] // empty
                | @tsv
              ')
          if [ -z "$PROTON_MAIL_RELEASE" ]; then
            echo "::error::No active stable Proton Mail RPM in official manifest"
            exit 1
          fi
          IFS=$'\t' read -r PROTON_MAIL_VERSION PROTON_MAIL_URL PROTON_MAIL_SHA512 <<< "$PROTON_MAIL_RELEASE"
          if [[ ! "$PROTON_MAIL_VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ||
                ! "$PROTON_MAIL_URL" =~ ^https://proton\.me/download/mail/linux/[0-9]+(\.[0-9]+)+/ProtonMail-desktop-beta\.rpm$ ||
                ! "$PROTON_MAIL_SHA512" =~ ^[0-9a-fA-F]{128}$ ]]; then
            echo "::error::Invalid Proton Mail version, URL, or SHA-512 in official manifest"
            exit 1
          fi

          # build-pins.env is sourced by build scripts. Shell-quote every value,
          # including existing GitHub-derived pins, so upstream metadata can
          # never inject syntax into that source operation.
          {
            printf 'NWG_DISPLAYS_TAG=%q\n' "$NWG_TAG"
            printf 'NUSHELL_TAG=%q\n' "$NUSHELL_TAG"
            printf 'NUSHELL_SHA256=%q\n' "$NUSHELL_SHA256"
            printf 'PASEO_RPM_URL=%q\n' "$PASEO_URL"
            printf 'PROTON_AUTHENTICATOR_VERSION=%q\n' "$PROTON_VERSION"
            printf 'PROTON_AUTHENTICATOR_RPM_URL=%q\n' "$PROTON_URL"
            printf 'PROTON_AUTHENTICATOR_SHA512=%q\n' "$PROTON_SHA512"
            printf 'PROTON_MAIL_VERSION=%q\n' "$PROTON_MAIL_VERSION"
            printf 'PROTON_MAIL_RPM_URL=%q\n' "$PROTON_MAIL_URL"
            printf 'PROTON_MAIL_SHA512=%q\n' "$PROTON_MAIL_SHA512"
          } > files/scripts/build-pins.env
          echo "=== Pin file ==="
          cat files/scripts/build-pins.env

      - name: Generate Containerfile
        run: |
          set -euo pipefail
          bluebuild generate \
            --registry "${IMAGE_REGISTRY}" \
            --registry-namespace "${{ github.repository_owner }}" \
            -o Containerfile.generated \
            "recipes/${{ matrix.recipe }}.yml"
          echo "=== Containerfile head ==="
          head -30 Containerfile.generated

      # Retried because every fetch this build makes — COPR repomd.xml, the
      # ghcr.io/blue-build/modules/* images mounted per step, vendor RPMs — is an
      # unretried network call, and one blip kills the whole ~10 min build. Three
      # scheduled runs died this way, each on a different upstream and each on a
      # URL that was serving 200 again by the time it was checked:
      #   2026-07-03  COPR 503 on celestelove/SwayOSD repomd.xml
      #   2026-07-10  ghcr blob copy died mid-pull of modules/files:latest,
      #               surfaced as the misleading "no stage or image found"
      #   2026-07-17  COPR 504 on yalter/niri repomd.xml
      # Backoff is minutes, not seconds: COPR gateway errors ride out a load
      # spike rather than a packet loss, so an immediate retry just re-fails.
      # Podman's layer cache makes attempt N+1 resume near the failure point.
      #
      # Tradeoff, deliberately accepted: a genuine recipe break (e.g. the
      # 2026-06-14 zed/zfs collision) now burns all 3 attempts + 3 min of sleep
      # before it reports. On a nightly job that is worth trading for not losing
      # an image to someone else's 504. Do NOT "fix" this by pattern-matching the
      # error text to decide retryability — the 07-10 pull failure proves upstream
      # reports transient faults with non-transient-looking messages.
      - name: Build with podman (serial stages, rootful overlay)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo podman build \
              --jobs=1 \
              --pull=newer \
              -t "localhost/${{ matrix.recipe }}:latest" \
              -f Containerfile.generated \
              . ; then
              echo "build succeeded on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::podman build failed 3/3 attempts — not a transient upstream blip, read the log above"
              exit 1
            fi
            echo "::warning::build attempt ${attempt}/3 failed — retrying in ${attempt}m"
            sleep "$((attempt * 60))"
          done
          echo "Images in podman store after build:"
          sudo podman images --format "{{.Repository}}:{{.Tag}}" | head -20

      # ----------------------------------------------------------------------
      # SMOKE-BOOT GATE.
      # Boot the just-built image, verify expected binaries + config files.
      # ----------------------------------------------------------------------
      - name: Smoke-boot test
        id: smoke
        run: |
          set -euo pipefail
          IMAGE="localhost/${{ matrix.recipe }}:latest"
          if ! sudo podman image exists "$IMAGE"; then
            echo "FAIL: $IMAGE not in podman store"
            sudo podman images
            exit 1
          fi
          echo "Smoke-testing $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          sudo podman run --rm --entrypoint /bin/bash "$IMAGE" -c '
            set -e
            FAIL=0
            check_bin() {
                if command -v "$1" >/dev/null 2>&1; then echo "  ok    $1"; else echo "  MISS  $1"; FAIL=1; fi
            }
            check_file() {
                if [ -e "$1" ]; then echo "  ok    $1"; else echo "  MISS  $1"; FAIL=1; fi
            }
            check_rpm() {
                RPM_NEVRA=$(rpm -q --qf "%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}" "$1" 2>/dev/null || true)
                if [ -n "$RPM_NEVRA" ]; then echo "  ok    rpm $RPM_NEVRA"; else echo "  MISS  rpm $1"; FAIL=1; fi
            }
            check_rpm_vendor() {
                RPM_VENDOR=$(rpm -q --qf "%{VENDOR}" "$1" 2>/dev/null || true)
                if [ "$RPM_VENDOR" = "$2" ]; then echo "  ok    $1 vendor: $RPM_VENDOR"; else echo "  FAIL  $1 vendor: ${RPM_VENDOR:-missing}, expected $2"; FAIL=1; fi
            }
            # rpmdb integrity, asserted BEFORE anything that depends on it.
            # Independent of any build-host theory: a storage layer that
            # silently scrambles the inherited ~90 MB rpmdb.sqlite still yields
            # a buildable image, and every check_rpm below would then report
            # MISS for a reason that has nothing to do with the recipe. Fail
            # here so the error names itself. See containers/fuse-overlayfs#475.
            echo "rpm database integrity:"
            if ! rpm -qa > /dev/null 2>&1; then
                echo "  FAIL: rpmdb unreadable - image is corrupt, refusing to push"
                exit 1
            fi
            echo "  ok    rpmdb readable ($(rpm -qa | wc -l) packages)"
            echo "Phase 0 bootstrap binaries:"
            for bin in pass gpg age ssh git jq curl; do check_bin "$bin"; done
            # Bluefin /opt -> /var/opt (first-boot populated). Inside docker/podman
            # run the runtime symlink chain dead-ends; verify rpm + real path instead.
            echo "Phase 0 Teams:"
            check_rpm teams-for-linux
            check_file /usr/lib/opt/teams-for-linux/teams-for-linux
            check_file /usr/lib/opt/teams-for-linux/teams-for-linux.real
            check_file /etc/teams-for-linux/config.json.default
            echo "Phase 2 system packages:"
            for p in kitty tmux kanshi mate-polkit syncthing swayidle \
                     niri waybar pavucontrol NetworkManager-tui blueman SwayNotificationCenter \
                     espanso-wayland hyprlock noctalia; do check_rpm "$p"; done
            check_bin noctalia
            check_rpm_vendor niri "Fedora Project"
            check_rpm_vendor noctalia "Fedora Project"
            check_file /etc/yum.repos.d/hyprlock.repo
            check_bin nu
            echo "  info  nushell $(nu --version)"
            if rpm -q noctalia-shell-v5 >/dev/null 2>&1; then
              echo "  FAIL  obsolete noctalia-shell-v5 package still installed"
              FAIL=1
            else
              echo "  ok    obsolete noctalia-shell-v5 absent"
            fi
            # nwg-displays — installed from upstream tarball (not RPM-backed).
            check_bin nwg-displays
            if ! grep -q NIRI_SOCKET /usr/lib/python3.*/site-packages/nwg_displays/main.py 2>/dev/null; then
                echo "  FAIL: nwg-displays installed but missing NIRI_SOCKET detection (pre-0.4)"
                exit 1
            fi
            echo "  ok    nwg-displays (niri-aware)"
            echo "Phase 3a GUI apps:"
            for p in chromium browserpass browserpass-chromium zen-browser helium-browser-bin; do
                check_rpm "$p"
            done
            echo "Phase 3g Telegram Desktop:"
            check_rpm telegram-desktop
            check_rpm_vendor telegram-desktop "RPM Fusion"
            check_bin Telegram
            check_file /usr/share/applications/org.telegram.desktop.desktop
            check_file /usr/share/dbus-1/services/org.telegram.desktop.service
            check_file /etc/yum.repos.d/rpmfusion-free-telegram.repo
            check_file /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-2020
            TELEGRAM_REPOS_OK=1
            for TELEGRAM_REPO_SECTION in rpmfusion-free-telegram rpmfusion-free-telegram-updates; do
                if [ "$(grep -Fxc "[$TELEGRAM_REPO_SECTION]" /etc/yum.repos.d/rpmfusion-free-telegram.repo || true)" -ne 1 ]; then
                    echo "  FAIL  Telegram repo section $TELEGRAM_REPO_SECTION missing or duplicated"
                    FAIL=1
                    TELEGRAM_REPOS_OK=0
                    continue
                fi
                TELEGRAM_REPO_BLOCK=$(sed -n "/^\\[$TELEGRAM_REPO_SECTION\\]$/,/^\\[/p" /etc/yum.repos.d/rpmfusion-free-telegram.repo)
                for TELEGRAM_REPO_SETTING in \
                    "includepkgs=telegram-desktop*" \
                    "gpgcheck=1" \
                    "gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-2020"; do
                    if ! printf "%s\n" "$TELEGRAM_REPO_BLOCK" | grep -Fxq "$TELEGRAM_REPO_SETTING"; then
                        echo "  FAIL  $TELEGRAM_REPO_SECTION missing $TELEGRAM_REPO_SETTING"
                        FAIL=1
                        TELEGRAM_REPOS_OK=0
                    fi
                done
            done
            if [ "$TELEGRAM_REPOS_OK" -eq 1 ]; then
                echo "  ok    RPM Fusion Telegram repos individually scoped and signature-checked"
            fi
            TELEGRAM_KEY_SHA256=$(sha256sum /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-2020 | cut -d " " -f 1)
            if [ "$TELEGRAM_KEY_SHA256" = "10fc0a3e1a0307e8088357a31a9c5e4e3d9f9e0b01db2b03b5790d949a47f3b3" ]; then
                echo "  ok    RPM Fusion signing key checksum"
            else
                echo "  FAIL  RPM Fusion signing key checksum mismatch"
                FAIL=1
            fi
            if ldd /usr/bin/Telegram 2>&1 | grep -q "not found"; then
                echo "  FAIL  Telegram has unresolved shared libraries"
                ldd /usr/bin/Telegram 2>&1 | grep "not found" || true
                FAIL=1
            else
                echo "  ok    Telegram shared libraries resolved"
            fi
            echo "Phase 3b GUI apps:"
            check_rpm beekeeper-studio
            echo "Proton Authenticator:"
            check_rpm proton-authenticator
            check_bin proton-authenticator
            check_file "/usr/share/applications/Proton Authenticator.desktop"
            if grep -Eq "^Exec=env WEBKIT_DISABLE_DMABUF_RENDERER=1 proton-authenticator([[:space:]].*)?$" "/usr/share/applications/Proton Authenticator.desktop"; then
                echo "  ok    app-scoped NVIDIA WebKit workaround"
            else
                echo "  FAIL  app-scoped NVIDIA WebKit workaround missing"
                FAIL=1
            fi
            if ldd /usr/bin/proton-authenticator 2>&1 | grep -q "not found"; then
                echo "  FAIL: proton-authenticator has unresolved shared libraries"
                ldd /usr/bin/proton-authenticator 2>&1 | grep "not found" || true
                FAIL=1
            else
                echo "  ok    proton-authenticator shared libraries resolved"
            fi
            echo "Proton Mail desktop:"
            check_rpm proton-mail
            check_bin proton-mail
            check_file /usr/share/applications/proton-mail.desktop
            check_file "/usr/lib/proton-mail/Proton Mail Beta"
            check_file /usr/lib/proton-mail/chrome-sandbox
            if ! grep -q "^MimeType=.*x-scheme-handler/mailto" /usr/share/applications/proton-mail.desktop; then
                echo "  FAIL: proton-mail desktop entry lost mailto handling"
                FAIL=1
            else
                echo "  ok    proton-mail mailto handler"
            fi
            if ldd "/usr/lib/proton-mail/Proton Mail Beta" 2>&1 | grep -q "not found"; then
                echo "  FAIL: proton-mail has unresolved shared libraries"
                ldd "/usr/lib/proton-mail/Proton Mail Beta" 2>&1 | grep "not found" || true
                FAIL=1
            else
                echo "  ok    proton-mail shared libraries resolved"
            fi
            echo "Baked GPG keys + .repo files (insulate build from upstream key-host outages):"
            check_file /etc/pki/rpm-gpg/RPM-GPG-KEY-terra-44
            check_file /etc/pki/rpm-gpg/RPM-GPG-KEY-beekeeper-studio
            check_file /etc/yum.repos.d/terra.repo
            check_file /etc/yum.repos.d/beekeeper-studio.repo
            echo "Phase 3c additions:"
            check_rpm zed
            # Terra zed is zfs-collision-aware: editor binary is zeditor and
            # /usr/bin/zed must stay owned by the zfs package. A monolithic zed
            # (e.g. a re-added che/zed COPR) would already have died at the
            # rpm-ostree conflict; this asserts the intended packaging anyway.
            # NOTE: this whole block runs inside a single-quoted podman run -c
            # wrapper, so use only DOUBLE quotes here. A single quote or a
            # backtick in this region breaks out of the wrapper (learned the
            # hard way 2026-06-14: it ate the editor check and failed the gate).
            check_bin zeditor
            if rpm -qf /usr/bin/zed 2>/dev/null | grep -q "^zfs-"; then
                echo "  ok    /usr/bin/zed owned by zfs (editor is zeditor)"
            else
                echo "  FAIL: /usr/bin/zed not owned by zfs - monolithic zed reintroduced the collision"
                exit 1
            fi
            check_rpm postgresql
            check_bin psql
            check_rpm wtype
            check_bin wtype
            check_rpm grim
            check_bin grim
            check_rpm slurp
            check_bin slurp

            echo "Phase 3f Noctalia Screen Toolkit host dependencies:"
            check_rpm tesseract
            check_bin tesseract
            check_rpm tesseract-langpack-eng
            check_rpm tesseract-langpack-nld
            TESS_LANGS=$(tesseract --list-langs 2>/dev/null || true)
            for lang in eng nld; do
                if grep -qx "$lang" <<< "$TESS_LANGS"; then
                    echo "  ok    tesseract language $lang"
                else
                    echo "  MISS  tesseract language $lang"
                    FAIL=1
                fi
            done
            if rpm -q pass-otp >/dev/null 2>&1; then
                echo "  FAIL  pass-otp installed despite Proton Authenticator owning OTP"
                FAIL=1
            else
                echo "  ok    pass-otp deliberately absent"
            fi
            if command -v wl-screenrec >/dev/null 2>&1; then
                echo "  FAIL  wl-screenrec present despite no approved Fedora package source"
                FAIL=1
            else
                echo "  ok    unmaintainable wl-screenrec absent"
            fi
            check_rpm wf-recorder
            check_bin wf-recorder
            check_rpm gpu-screen-recorder
            check_bin gpu-screen-recorder
            check_bin gsr-kms-server
            check_file /etc/yum.repos.d/gpu-screen-recorder.repo
            check_rpm_vendor gpu-screen-recorder "Fedora Copr - user lionheartp"
            if grep -qx "includepkgs=gpu-screen-recorder" /etc/yum.repos.d/gpu-screen-recorder.repo; then
                echo "  ok    gpu-screen-recorder COPR is exact-package scoped"
            else
                echo "  FAIL  gpu-screen-recorder COPR scope widened or missing"
                FAIL=1
            fi
            GSR_VERSION=$(rpm -q --qf "%{VERSION}" gpu-screen-recorder 2>/dev/null || true)
            if [ "$(printf "%s\n" "6.0.2" "$GSR_VERSION" | sort -V | head -n1)" != "6.0.2" ]; then
                echo "  FAIL  gpu-screen-recorder ${GSR_VERSION:-missing} is older than required 6.0.2"
                FAIL=1
            else
                echo "  ok    gpu-screen-recorder $GSR_VERSION (>= 6.0.2)"
            fi
            GSR_CAP=$(/usr/sbin/getcap /usr/bin/gsr-kms-server 2>/dev/null || true)
            if [ "$GSR_CAP" = "/usr/bin/gsr-kms-server cap_sys_admin=ep" ]; then
                echo "  ok    gsr-kms-server capability: cap_sys_admin=ep"
            else
                echo "  FAIL  gsr-kms-server capability missing or broader than cap_sys_admin=ep: ${GSR_CAP:-none}"
                FAIL=1
            fi
            if ldd /usr/bin/gpu-screen-recorder 2>&1 | grep -q "not found"; then
                echo "  FAIL  gpu-screen-recorder has unresolved shared libraries"
                ldd /usr/bin/gpu-screen-recorder 2>&1 | grep "not found" || true
                FAIL=1
            else
                echo "  ok    gpu-screen-recorder shared libraries resolved"
            fi
            if zgrep -Fq "default_output|default_input" /usr/share/man/man1/gpu-screen-recorder.1.gz; then
                echo "  ok    gpu-screen-recorder documents combined system and microphone audio"
            else
                echo "  FAIL  gpu-screen-recorder combined-audio CLI contract missing"
                FAIL=1
            fi
            for encoder in h264_vaapi h264_nvenc; do
                if ffmpeg -hide_banner -encoders 2>/dev/null | grep -qw "$encoder"; then
                    echo "  ok    ffmpeg encoder $encoder"
                else
                    echo "  MISS  ffmpeg encoder $encoder"
                    FAIL=1
                fi
            done

            echo "Phase 3d OBS Studio + v4l2loopback:"
            check_rpm obs-studio
            check_bin obs
            check_rpm obs-studio-plugin-vaapi
            check_rpm v4l-utils
            check_bin v4l2-ctl
            check_rpm mediainfo
            check_bin mediainfo
            check_rpm kmod-v4l2loopback
            check_file /etc/modules-load.d/v4l2loopback.conf
            check_file /etc/modprobe.d/v4l2loopback.conf
            if ! grep -q "video_nr=10" /etc/modprobe.d/v4l2loopback.conf; then
                echo "  FAIL: /etc/modprobe.d/v4l2loopback.conf missing video_nr=10 pin"
                exit 1
            fi
            echo "  ok    video_nr=10 pin"

            echo "Phase 3e showmethekey:"
            check_rpm showmethekey
            check_bin showmethekey-gtk
            check_file /etc/yum.repos.d/showmethekey.repo
            SHOWMETHEKEY_VERSION=$(rpm -q --qf "%{VERSION}" showmethekey 2>/dev/null || true)
            if [ "$(printf "%s\n" "1.21.0" "$SHOWMETHEKEY_VERSION" | sort -V | head -n1)" != "1.21.0" ]; then
              echo "  FAIL: showmethekey ${SHOWMETHEKEY_VERSION:-missing} is older than required 1.21.0"
              FAIL=1
            else
              echo "  ok    showmethekey $SHOWMETHEKEY_VERSION (>= 1.21.0)"
            fi
            if ! rpm -ql showmethekey 2>/dev/null | grep -q "/usr/share/polkit-1/"; then
                echo "  FAIL: showmethekey RPM ships no /usr/share/polkit-1/ rule — input access would prompt for sudo"
                exit 1
            fi
            echo "  ok    polkit rule shipped"

            # Fontconfig. Pin /usr/bin/fc-* — a bare fc-list can resolve to a
            # different fontconfig that reads a different cache set and reports
            # healthy on a broken image.
            echo "Fontconfig - fonts actually resolvable:"
            if /usr/bin/fc-list | grep -qi "Noto Color Emoji"; then echo "  ok    fc-list Noto Color Emoji"; else echo "  MISS  fc-list Noto Color Emoji"; FAIL=1; fi
            if /usr/bin/fc-match emoji | grep -q "Noto Color Emoji"; then echo "  ok    fc-match emoji"; else echo "  MISS  fc-match emoji"; FAIL=1; fi
            # BEHAVIOURAL, not presence. This gate previously asserted emoji only
            # and would have passed green with every serif font invisible - which
            # is exactly the bug that shipped. "Noto Serif" is the canary that
            # fc-cache-boot.sh and rebuild-font-cache.sh both depend on.
            if /usr/bin/fc-list | grep -qi "Noto Serif"; then echo "  ok    fc-list Noto Serif (canary present)"; else echo "  MISS  fc-list Noto Serif - fc-cache-boot canary would wipe the cache every boot"; FAIL=1; fi
            if /usr/bin/fc-list | grep -q "^/usr/share/fonts"; then echo "  ok    /usr/share/fonts contributes fonts"; else echo "  MISS  /usr/share/fonts contributes ZERO fonts"; FAIL=1; fi
            if /usr/bin/fc-match serif | grep -qi "nerd font"; then
                echo "  MISS  fc-match serif resolves to a Nerd Font (monospace) - system fonts hidden"; FAIL=1
            else
                echo "  ok    fc-match serif is not a Nerd Font"
            fi
            # Container-collision fix (distrobox shares $HOME -> shared
            # ~/.cache/fontconfig; fontconfig keys caches on md5(dir path)).
            # The epoch stamp is the fix - assert it is still present.
            check_file /usr/libexec/bluefin-udx/fc-cache-boot.sh
            if grep -q "touch -d @0" /usr/libexec/bluefin-udx/fc-cache-boot.sh; then
                echo "  ok    boot script epoch-stamps the cache"
            else
                echo "  MISS  boot script no longer epoch-stamps - container-collision fix is GONE"; FAIL=1
            fi
            if ls /usr/lib/fontconfig/cache/*.cache-* >/dev/null 2>&1; then
                echo "  ok    baked cache present in /usr/lib/fontconfig/cache"
            else
                echo "  MISS  /usr/lib/fontconfig/cache empty - build-time bake was a no-op"; FAIL=1
            fi
            # NOTE: this smoke test runs in a plain OCI container, NOT composefs,
            # and has no shared $HOME - so it structurally CANNOT reproduce the
            # container-poisoning bug itself. These are shipped-artifact assertions
            # only. Real behavioural verification happens on the booted host.

            # NVIDIA variant adds nvtop. CUDA toolkit not baked — use
            # nvidia/cuda containers per project (atomic /usr/local quirk).
            if [ "${{ matrix.recipe }}" = "bluefin-udx-nvidia" ]; then
                echo "Phase 4 NVIDIA additions:"
                check_rpm nvtop
                check_bin nvtop
                check_bin nvidia-smi
                check_bin nvidia-ctk
            fi
            exit $FAIL
          '

      # ----------------------------------------------------------------------
      # Push (only on main, only after smoke-boot passed).
      # ----------------------------------------------------------------------
      # ghcr.io login + lowercase registry are inlined as shell to avoid
      # third-party JavaScript actions (redhat-actions/podman-login@v1 and
      # ASzc/change-string-case-action@v6 were the last two pinned to Node.js
      # 20, deprecated by GitHub on 2026-06-16). No more upstream-action
      # version chasing.
      - name: Log in to ghcr + lowercase registry
        id: regcase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          # Write the auth file world-readable so the unsudo'd cosign step
          # can read it. Token is short-lived (GITHUB_TOKEN expires when the
          # job ends) and the runner is ephemeral, so 0644 is acceptable.
          echo "$GHCR_TOKEN" | sudo podman login ghcr.io \
            --username "$GHCR_USER" --password-stdin \
            --authfile /tmp/auth.json
          sudo chmod 0644 /tmp/auth.json
          # podman's --authfile JSON shape is identical to Docker's
          # config.json. cosign uses go-containerregistry's
          # DefaultKeychain which only looks at ~/.docker/config.json
          # (or $DOCKER_CONFIG/config.json) — NOT REGISTRY_AUTH_FILE.
          # Mirror /tmp/auth.json into the runner user's docker config so
          # the later Sign image step finds creds without rerunning login.
          mkdir -p "$HOME/.docker"
          cp /tmp/auth.json "$HOME/.docker/config.json"
          LOWER=$(printf '%s' "${IMAGE_REGISTRY}" | tr '[:upper:]' '[:lower:]')
          echo "lowercase=${LOWER}" >> "$GITHUB_OUTPUT"

      - name: Tag and push to ghcr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: push
        env:
          REGISTRY_AUTH_FILE: /tmp/auth.json
        run: |
          set -euo pipefail
          SRC="${{ steps.smoke.outputs.image }}"
          REG="${{ steps.regcase.outputs.lowercase }}"
          NAME="${{ matrix.recipe }}"
          DATE_TAG="$(date -u +%Y%m%d)"
          SHA_TAG="${GITHUB_SHA::7}"

          # Always push :stable + a dated tag + a sha tag (rollback targets).
          # sudo -E preserves REGISTRY_AUTH_FILE so rootful podman push
          # finds the credentials written by `sudo podman login` above.
          for TAG in stable "$DATE_TAG" "$SHA_TAG"; do
            DEST="${REG}/${NAME}:${TAG}"
            sudo podman tag "$SRC" "$DEST"
            sudo -E podman push "$DEST"
            echo "pushed $DEST"
          done

          # Capture the digest that consumers (rpm-ostree) actually pull when
          # resolving :stable. ghcr wraps `podman push` results in an OCI
          # image index, so the inner manifest digest reported by
          # `podman inspect ... RepoDigests` is NOT the digest the tag floats
          # to — the index digest is. Signing the inner manifest produced
          # an unverifiable :stable (observed 2026-06-05: rpm-ostree upgrade
          # rejected with "A signature was required, but no signature
          # exists"). skopeo inspect docker://… resolves the tag against
          # the registry and returns the canonical digest cosign should sign.
          DIGEST=$(skopeo inspect "docker://${REG}/${NAME}:stable" --format '{{.Digest}}')
          echo "image_ref=${REG}/${NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Will sign: ${REG}/${NAME}@${DIGEST}"

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "WARN: SIGNING_SECRET not set; image pushed unsigned."
            exit 0
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}"
          echo "signed ${IMAGE_REF}"
