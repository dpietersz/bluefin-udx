<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Register /var/cache/fontconfig as the writable, system-wide cache directory.

  /var is runtime state on bootc, so tmpfiles creates this directory and
  fc-cache-boot.service rebuilds it before the display manager starts. The
  host-only cache namespace lives separately in
  06-bluefin-host-font-dir-salt.conf: it salts system font directories so they
  cannot collide with unsalted caches written by containers sharing $HOME.
-->
<fontconfig>
  <cachedir>/var/cache/fontconfig</cachedir>
</fontconfig>
