<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  05-bluefin-writable-cache.conf — register /var/cache/fontconfig as a writable,
  shared, system-wide fontconfig cache directory.

  WHY THIS EXISTS (read before deleting):
  /var is runtime state on bootc and cannot be baked, so the boot-time rebuild
  needs a writable cachedir that exists on every machine. This file declares it.
  /usr/lib/tmpfiles.d/fontconfig-var-cache.conf creates the directory, and
  /usr/libexec/bluefin-udx/fc-cache-boot.sh populates and epoch-stamps it.

  ================= CORRECTED 2026-08-03 — THE OLD RATIONALE WAS WRONG =========

  This file used to claim that under composefs "FcCacheTimeValid ALWAYS fails for
  /usr/share/fonts, so every process rescans that whole directory live on
  startup", and that the bug was a race between that rescan and login-time font
  churn. Both halves are false, and they sent three previous fixes in the wrong
  direction. The truth is the exact inverse.

  fontconfig 2.17 src/fccache.c, FcCacheTimeValid ends:

      return dir_stat->st_mtime == 0 || (cache->checksum == (int)dir_stat->st_mtime && fnano);

  Under ostree/composefs every /usr directory presents an epoch mtime, so that
  leading `st_mtime == 0 ||` short-circuits to TRUE. The staleness check is a
  NO-OP for /usr paths: caches are accepted unconditionally and FOREVER. Live
  confirmation via FC_DEBUG=16:

      FcCacheTimeValid dir "/usr/share/fonts" cache checksum 0 dir checksum 0

  There is no live rescan and no race. What there IS: distrobox bind-mounts the
  host $HOME into every toolbox at the same path, so ~/.cache/fontconfig is ONE
  directory shared by the host and all containers. fontconfig keys cache files on
  md5(<absolute dir path>), and /usr/share/fonts means something completely
  different inside an Ubuntu toolbox (X11/opentype/truetype) than on the host
  (37 RPM subdirs). Any app in a toolbox that touches fonts writes a ~216-byte
  cache under the HOST's exact key — and Ubuntu 24.04 ships fontconfig 2.15, the
  same cache-9 format the host reads. The host then sees zero system fonts, the
  user's Nerd Fonts win generic serif by glyph coverage, and Chromium/Electron
  render a monospace for `serif`. Because of the short-circuit above, it never
  heals. Reproduce: `distrobox enter <ubuntu-box>` then `fc-cache -f`.

  BEING THE FIRST CACHEDIR DOES NOT HELP. conf.d is <include>d at line 88 of
  /etc/fonts/fonts.conf, before the cachedir block at 92-95, so this element can
  only ever be FIRST — and first LOSES. Measured on 2.17.0 (good = correct
  1928 B cache, bad = container poison), permuting cachedirs via FONTCONFIG_FILE:

      mtimes          [good,bad]   [bad,good]
      equal               0           666
      bad newer           0           666
      good newer          0           666
      good mtime=0      666           666     <== the fix

  So the fix is NOT ordering — it is the epoch stamp applied by fc-cache-boot.sh,
  which turns the short-circuit above from the thing that makes the poison
  permanent into the thing that makes OUR cache win from any position.

  This file is still required, because it provides the writable cachedir. Keep it
  for that reason, not for its position. Full rationale, upstream links and the
  fontconfig 2.18 caveat live in fc-cache-boot.sh.

  Upstream: https://github.com/89luca89/distrobox/issues/1945 (open since 2025-12)
            https://github.com/89luca89/distrobox/pull/2149   (open, unmerged)
-->
<fontconfig>
  <cachedir>/var/cache/fontconfig</cachedir>
</fontconfig>
