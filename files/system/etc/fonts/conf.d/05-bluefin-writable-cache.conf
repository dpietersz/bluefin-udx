<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  05-bluefin-writable-cache.conf — register /var/cache/fontconfig as a writable,
  shared, system-wide fontconfig cache directory.

  WHY THIS EXISTS (read before deleting):
  Under ostree/composefs, /usr/share/fonts presents an epoch (1970) directory
  mtime at runtime, but the fontconfig caches that index it (the baked
  /usr/lib/fontconfig/cache AND any ~/.cache/fontconfig copy) record a real,
  non-epoch mtime at the moment they are built. fontconfig's validity check
  (FcCacheTimeValid: cache-checksum vs dir-checksum) therefore ALWAYS fails for
  /usr/share/fonts, so every process rescans that whole directory live on
  startup. That live rescan is fragile: when it races font-dir churn at login
  (e.g. a distrobox host-font bind-mount of /run/host/usr/share/fonts firing as
  the niri session starts), the app comes up with the system sans-serif missing
  and Chromium/Electron (Helium, teams-for-linux) fall back to their last-resort
  font — monospace text + tofu/blank emoji — and CACHE that decision in-process
  for the whole session. Restarting the app "fixes" it; it silently returns after
  the next image-update reboot. (See MEMORY: emoji-tofu-fontconfig-fix.)

  conf.d is <include>d at line 88 of /etc/fonts/fonts.conf, BEFORE the cachedir
  block (lines 92-95), so this <cachedir> becomes the FIRST cache directory:
    1. /var/cache/fontconfig          (here: writable, shared, root-owned)
    2. /usr/lib/fontconfig/cache      (baked, read-only, perpetually stale for /usr/share/fonts)
    3. ~/.cache/fontconfig            (xdg, per-user)
    4. ~/.fontconfig

  fc-cache-boot.service rebuilds the system caches into this directory early at
  every boot — in a quiet namespace, before the display manager and before any
  distrobox/user-session font churn — capturing the stable epoch mtime so the
  cache validates for the rest of the session. GUI apps then read a VALID cache
  here instead of doing a fragile live rescan. The directory itself is created by
  the tmpfiles snippet usr/lib/tmpfiles.d/fontconfig-var-cache.conf (/var is
  runtime state on bootc, so it cannot be baked into the image).

  This is the durable, image-side counterpart to the user-scope mitigations in
  dotfiles (75-emoji-color.conf, refresh-fontconfig-cache.service): those keep
  the user cache warm but cannot make /usr/share/fonts validate, which is the
  actual root cause this file fixes.
-->
<fontconfig>
  <cachedir>/var/cache/fontconfig</cachedir>
</fontconfig>
