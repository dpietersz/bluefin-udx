<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Give the host's system font trees a stable, host-only cache namespace.

  distrobox shares $HOME (and therefore ~/.cache/fontconfig) with the host, but
  its /usr/share/fonts is a different filesystem. Fontconfig uses a directory's
  path plus this salt to name its cache, so the host's caches cannot collide with
  a container's unsalted caches at any cache format version.

  These duplicate the system entries from /etc/fonts/fonts.conf intentionally.
  Fontconfig 2.15+ updates the existing directory's salt; no <reset-dirs/> is
  needed, so user and custom directories remain configured. Replacement moves
  these system entries to the end of the current list; it does not preserve
  directory order. Descendants inherit the parent salt.

  Keep this file image-owned, never in shared user fontconfig: a container
  loading the same salt with a different font tree would collide again.
-->
<fontconfig>
  <dir salt="bluefin-udx-host">/usr/share/fonts</dir>
  <dir salt="bluefin-udx-host">/usr/local/share/fonts</dir>
  <dir salt="bluefin-udx-host">/usr/share/X11/fonts/Type1</dir>
  <dir salt="bluefin-udx-host">/usr/share/X11/fonts/TTF</dir>
</fontconfig>
