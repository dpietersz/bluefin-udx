# v4l2loopback module options for OBS Studio virtual camera.
#
# exclusive_caps=1 — REQUIRED for Chromium-family apps (Teams desktop,
#                    Zoom web client, Slack huddles) to recognize the
#                    loopback device as a real V4L2 capture source.
#                    Without it, the device shows up in `v4l2-ctl
#                    --list-devices` but the camera picker in those apps
#                    silently skips it.
# card_label       — Friendly name shown in camera picker UIs.
# devices=1        — Single virtual device is enough for OBS's
#                    single-output virtual-camera workflow.
# video_nr=10      — Pin the loopback to /dev/video10 instead of letting
#                    it grab the lowest free /dev/videoN slot at boot.
#                    Without this, v4l2loopback races the real webcam
#                    driver and frequently wins /dev/video0 (verified on
#                    P14s Gen 5: Integrated Camera exposes 4 v4l2 nodes;
#                    loopback was landing at video0, real camera at
#                    video1-4). Apps that naively pick "first camera"
#                    (some browsers' getUserMedia default, Electron meeting
#                    apps, scripts hardcoding /dev/video0) then silently
#                    select the virtual camera. Pinning to 10 makes
#                    selection an intentional act and keeps real cameras
#                    at the low /dev/videoN they would naturally take.
options v4l2loopback exclusive_caps=1 card_label="OBS Virtual Camera" devices=1 video_nr=10
