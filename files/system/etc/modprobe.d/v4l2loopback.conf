# v4l2loopback module options for OBS Studio virtual camera.
#
# exclusive_caps=1 — REQUIRED for Chromium-family apps (Teams desktop,
#                    Zoom web client, Slack huddles) to recognize the
#                    loopback device as a real V4L2 capture source.
#                    Without it, the device shows up in `v4l2-ctl
#                    --list-devices` but the camera picker in those apps
#                    silently skips it.
# card_label       — Friendly name shown in camera picker UIs.
# devices=1        — Single virtual device at /dev/video* is enough for
#                    OBS's single-output virtual-camera workflow.
options v4l2loopback exclusive_caps=1 card_label="OBS Virtual Camera" devices=1
