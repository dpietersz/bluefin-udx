# Make Electron/Chromium-based apps detect gnome-libsecret as their password
# store under tiling-WM sessions (niri, sway, Hyprland) that don't natively
# advertise a Chromium-recognised desktop tag.
#
# Chromium's KeyStorageLinux::SelectBackend checks XDG_CURRENT_DESKTOP for
# substrings GNOME / Unity / Pantheon / KDE. If none match, it falls back to
# the "basic" (plaintext) backend, and apps like Microsoft Azure Storage
# Explorer and Vibe Typer then refuse to start with "no password manager
# service" errors — even though gnome-keyring-daemon is running and the
# org.freedesktop.secrets D-Bus service is available.
#
# Appending :GNOME makes Chromium pick gnome-libsecret. Harmless under a real
# GNOME session (already wins), and the chain preserves the original tag so
# tiling-WM-aware apps still see it.
XDG_CURRENT_DESKTOP=${XDG_CURRENT_DESKTOP:+${XDG_CURRENT_DESKTOP}:}GNOME
