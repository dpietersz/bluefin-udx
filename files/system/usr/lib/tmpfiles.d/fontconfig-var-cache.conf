# Create the shared, writable, system-wide fontconfig cache directory.
#
# On bootc/ostree, /var is runtime machine state and is NOT carried over from the
# image's baked /var, so the directory registered as a <cachedir> in
# /etc/fonts/conf.d/05-bluefin-writable-cache.conf must be (re)created at boot by
# systemd-tmpfiles. fc-cache-boot.service (ordered After=systemd-tmpfiles-setup)
# then populates it with valid system font caches before the display manager.
#
# 0755 root:root: root-writable (the boot service runs as root) and world-readable
# so every user session reads the system caches from here.
d /var/cache/fontconfig 0755 root root -
