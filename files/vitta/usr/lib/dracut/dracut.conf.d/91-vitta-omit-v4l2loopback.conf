# Keep the OBS virtual camera module OUT of the initramfs.
#
# dracut copies /etc/modules-load.d/v4l2loopback.conf into the initramfs, so
# the module would load there (~2 s into boot) with only the package defaults
# from /usr/lib/modprobe.d/98-v4l2loopback.conf: no video_nr=10, so the
# loopback grabs /dev/video0 ahead of the real webcam (seen on the T580,
# 2026-11-08). Loading it from the real root instead applies
# /etc/modprobe.d/v4l2loopback.conf (video_nr=10, devices=1).
omit_drivers+=" v4l2loopback "
