# Vitta: pin the OBS virtual camera to /dev/video10 even when the module is
# loaded from the initramfs.
#
# The v4l2loopback package ships /usr/lib/modprobe.d/98-v4l2loopback.conf and
# /usr/lib/modules-load.d/v4l2loopback.conf; dracut copies both into the image
# initramfs, so the module loads ~2 s into boot, before /etc/modprobe.d (with
# video_nr=10) is reachable. Without this file the loopback takes /dev/video0
# ahead of the real webcam (seen on the T580, 2026-11-08). /usr/lib/modprobe.d
# IS copied into the initramfs, and modprobe appends options from every file,
# so these join the package's exclusive_caps/card_label options.
options v4l2loopback devices=1 video_nr=10
