# greetd's home holds the Quickshell greeter's config/cache/state and
# vitta-last-user. The greetd package ships the directory in its payload and
# only a `Z` (fix ownership) tmpfiles line, so a machine that rebases onto
# Vitta (existing /var, which ostree never repopulates) would not have it.
d /var/lib/greetd 0750 greetd greetd -
# greetd's %post masks xdg-desktop-portal for the greeter's user manager so the
# greeter cannot stall on, or spawn, portal backends. %post output lives in the
# image's /var, which a rebase never applies, so recreate the mask here.
d /var/lib/greetd/.config                     0755 greetd greetd -
d /var/lib/greetd/.config/systemd             0755 greetd greetd -
d /var/lib/greetd/.config/systemd/user        0755 greetd greetd -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
