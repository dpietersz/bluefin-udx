# bluefin-udx-nvidia — NVIDIA variant (open kernel modules)
# Use on machines with an NVIDIA GPU (e.g. ThinkPad P14s Gen5 with RTX).
# Base: Bluefin DX stable + NVIDIA open kernel modules. "Open" is the modern
# recommendation for Turing+ cards and supports full CUDA.
#
# Phase 0: same package set as the Intel variant. Phase 4 will add cuda-toolkit
# + nvtop here only (kept out of common.yml to keep the Intel image lean).

name: bluefin-udx-nvidia
description: Personal Bluefin DX custom image with NVIDIA open drivers
base-image: ghcr.io/ublue-os/bluefin-dx-nvidia-open
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /
  - from-file: common.yml

  # ---------------------------------------------------------------------------
  # Phase 4 — NVIDIA-only additions.
  #
  # NOT baked: cuda-toolkit (nvcc + headers).
  #   CUDA's RPMs install to /usr/local/cuda-XX.Y/. Bluefin's atomic FS
  #   redirects /usr/local → /var/usrlocal, and /var content is stripped
  #   on image commit. Files installed are physically gone from the image.
  #
  #   The base bluefin-dx-nvidia-open image already includes:
  #     - NVIDIA open kernel driver + firmware + libs
  #     - nvidia-container-toolkit (libnvidia-container, nvidia-ctk)
  #     - nvidia-driver-cuda-libs (CUDA runtime / libcuda.so)
  #     - nvidia-smi
  #   …which is everything needed to RUN CUDA workloads.
  #
  #   For native nvcc/compilation work, the modern atomic-OS pattern is:
  #     podman run --rm --device nvidia.com/gpu=all \
  #       nvcr.io/nvidia/cuda:13.2-devel-fedora41 nvcc your_code.cu
  #
  #   Per-project CUDA version pinning, no host pollution, no atomic-FS fight.
  #   See MAINTENANCE.md for the recommended workflow.
  # ---------------------------------------------------------------------------
  - type: rpm-ostree
    install:
      - nvtop                 # live GPU monitoring (Fedora base)
