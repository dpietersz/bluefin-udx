# bluefin-udx-nvidia — NVIDIA variant (open kernel modules)
# Use on machines with an NVIDIA GPU (e.g. ThinkPad P14s Gen5 with RTX).
# Base: Bluefin DX stable + NVIDIA open kernel modules. "Open" is the modern
# recommendation for Turing+ cards and supports full CUDA.
#
# Phase 0: same package set as the Intel variant. Phase 4 will add cuda-toolkit
# + nvtop here only (kept out of common.yml to keep the Intel image lean).

name: bluefin-udx-nvidia
description: Personal Bluefin DX custom image with NVIDIA open drivers
base-image: ghcr.io/ublue-os/bluefin-dx-nvidia-open
image-version: stable

modules:
  - from-file: common.yml

  # ---------------------------------------------------------------------------
