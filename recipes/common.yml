# bluefin-udx — shared module set
# Included by recipes/bluefin-udx.yml and recipes/bluefin-udx-nvidia.yml.
# Phase 0 scope: only bootstrap-critical packages + Microsoft Teams.
# Later phases will add system tools (Phase 2), GUI apps (Phase 3), and
# Playwright system deps (Phase 3.5). See RECIPE.md for the package manifest.

modules:
  # ---------------------------------------------------------------------------
  # Bootstrap-critical packages.
  # These guarantee the dotfiles SSH/GPG/password-store decryption chain works
  # on first boot of a fresh machine, without requiring rpm-ostree layering from
  # chezmoi. Order of operations on a fresh machine:
  #   1. Install vanilla Bluefin DX from USB
  #   2. sudo bootc switch ghcr.io/dpietersz/bluefin-udx[-nvidia]:stable
  #   3. reboot
  #   4. chezmoi apply  (decrypts keys, clones password-store — all binaries below
  #                     are already on PATH, no rpm-ostree calls needed)
  # ---------------------------------------------------------------------------
  - type: rpm-ostree
    repos:
      # Microsoft Teams (unofficial maintained client, supports Wayland screen share
      # via PipeWire portal — the whole reason this repo exists).
      # See: https://github.com/IsmaelMartinez/teams-for-linux
      - https://repo.teamsforlinux.de/rpm/teams-for-linux.repo
    keys:
      # GPG key for the teams-for-linux RPM repo. Without this, rpm-ostree
      # refuses the package: "could not be verified".
      - https://repo.teamsforlinux.de/teams-for-linux.asc
    install:
      # bootstrap-critical: dotfiles assumes these are present at first apply
      - pass
      - gnupg2
      - age
      - openssh-clients
      - git
      - jq
      - curl
      # GUI app — bake reason: screen sharing reliability on Wayland; distrobox
      # path was unreliable. See RECIPE.md.
      - teams-for-linux

  # ---------------------------------------------------------------------------
  # Teams Wayland integration patch.
  # Rewrites the upstream .desktop Exec line to enable PipeWire screen capture
  # and seeds a default config on first launch. Ported verbatim from boxkit
  # browser-toolbox.sh (battle-tested logic — don't re-derive).
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - teams-wayland-patch.sh

  # ---------------------------------------------------------------------------
  # Paseo desktop (https://paseo.sh).
  # No vendor yum repo and asset filenames embed the version, so we resolve
  # the latest x86_64 RPM from the GitHub release API at image build time.
  # Every image rebuild = freshest Paseo. CLI counterpart (@getpaseo/cli) is
  # installed per-user via chezmoi (run_onchange_after_18-install-paseo-cli).
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - install-paseo-latest.sh

  # ---------------------------------------------------------------------------
  # Client-side cosign verification for ghcr.io/dpietersz/* images.
  # Wires policy.json + registries.d so `rpm-ostree rebase ostree-image-signed:`
  # validates the image signature before deploying. The ghcr.io/dpietersz
  # namespace hosts images signed by two distinct keys, so the policy entry
  # uses keyPaths (OR semantics):
  #   /usr/lib/pki/containers/bluefin-udx.pub   — bluefin-udx[-nvidia] bootc images
  #   /usr/lib/pki/containers/dpietersz.pub     — boxkit toolboxes
  #                                                (udx-toolbox, playwright-toolbox);
  #                                                vendored from
  #                                                github.com/dpietersz/boxkit/cosign.pub
  # The repo also ships a compat copy at `bluefin-udx-nvidia.pub` so hosts
  # whose /etc/containers/policy.json still references the old keyPath
  # (from the initial bridge fix) keep verifying across the rename.
  # Pubkeys + registries.d snippet land via the files module above; this script
  # merges the policy.json entry (the only piece that can't be a static overlay
  # without clobbering upstream Bluefin entries).
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - install-cosign-policy.sh

  # ---------------------------------------------------------------------------
  # PHASE 2 — system packages migrated out of dotfiles/.chezmoiscripts/
  # Replaces:
  #   02-install-kitty   tmux   nushell
  #   00b-install-polkit-agent (mate-polkit)
  #   01a-install-syncthing
  #   04-install-niri  (niri + waybar + supporting tools, via yalter/niri COPR)
  #   02-install-espanso (espanso-wayland via Terra)
  #   11-install-hyprlock-stack (hyprlock from Terra, swayidle from Fedora)
  #   05-install-noctalia (noctalia-shell-v5 from lionheartp/Hyprland COPR)
  # ---------------------------------------------------------------------------
  - type: rpm-ostree
    repos:
      # Terra — espanso-wayland and hyprlock live here. The Terra RPM ships
      # CAP_DAC_OVERRIDE pre-set on espanso, so no separate setcap module.
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      # niri compositor + supporting tools
      - https://copr.fedorainfracloud.org/coprs/yalter/niri/repo/fedora-%OS_VERSION%/yalter-niri-fedora-%OS_VERSION%.repo
      # noctalia-shell-v5
      - https://copr.fedorainfracloud.org/coprs/lionheartp/Hyprland/repo/fedora-%OS_VERSION%/lionheartp-Hyprland-fedora-%OS_VERSION%.repo
      # nushell (Phase 2.5) — replaces the Homebrew-managed nushell as the
      # system shell. Shells are system-integration-sensitive (PAM,
      # /etc/shells, terminal launcher) and brew-managed paths are awkward
      # for default shells, so we bake.
      - https://copr.fedorainfracloud.org/coprs/atim/nushell/repo/fedora-%OS_VERSION%/atim-nushell-fedora-%OS_VERSION%.repo
      # swayosd (Phase 2.5) — OSD for volume/brightness/caps-lock under niri,
      # part of the WM stack per AGENTS.md.
      - https://copr.fedorainfracloud.org/coprs/celestelove/SwayOSD/repo/fedora-%OS_VERSION%/celestelove-SwayOSD-fedora-%OS_VERSION%.repo
      # NOTE: Obsidian deferred to Phase 3b — alxhr0/Obsidian COPR was 404 as
      # of 2026-05-22 (GPG pubkey URL returns 404). Will install via AppImage
      # extract in Phase 3b alongside Polypane.
      #
      # Zen Browser (Phase 3a) — community COPR, auto-rebuilt from upstream
      # Zen release binaries. Fallback: firminunderscore/zen-browser.
      - https://copr.fedorainfracloud.org/coprs/sneexy/zen-browser/repo/fedora-%OS_VERSION%/sneexy-zen-browser-fedora-%OS_VERSION%.repo
      # Zed editor (Phase 3c) — no official vendor RPM. che/zed is the active
      # community COPR (latest build 2026-05-15, supports fedora-44). Terra
      # doesn't ship zed. Fallback: build from source via install script.
      - https://copr.fedorainfracloud.org/coprs/che/zed/repo/fedora-%OS_VERSION%/che-zed-fedora-%OS_VERSION%.repo
      # Beekeeper Studio (Phase 3b) — NOT loaded from vendor URL because
      # the upstream .repo file at rpm.beekeeperstudio.io/beekeeper-studio.repo
      # points gpgkey= at a *signature file* (repomd.xml.asc) rather than a
      # public key, so rpm-ostree refuses with "Public key not found".
      # Corrected .repo file is shipped via files/system/etc/yum.repos.d/.
    keys:
      # GPG key for Beekeeper Studio's vendor repo (Phase 3b).
      - https://rpm.beekeeperstudio.io/beekeeper.key
    install:
      # Fedora base repos
      - kitty
      - tmux
      - kanshi              # Phase 2.5 — Wayland output config daemon for niri
      - mate-polkit
      - syncthing
      - swayidle
      # niri COPR
      - niri
      - waybar
      - pavucontrol
      - NetworkManager-tui
      - blueman
      - SwayNotificationCenter   # binary: swaync
      # Terra
      - espanso-wayland
      - hyprlock
      # lionheartp/Hyprland COPR
      - noctalia-shell-v5
      # Phase 2.5 COPRs
      - nushell
      - swayosd
      # nwg-displays runtime + build deps (the package itself is installed
      # from upstream tarball via install-nwg-displays-latest.sh below —
      # COPR tofik/nwg-shell is stuck on v0.3.28 which predates niri support).
      # gtk3, gtk-layer-shell, python3-gobject, python3-i3ipc are already
      # pulled by other Phase 2 packages; listed here for explicit guarantee.
      - gtk3
      - gtk-layer-shell
      - python3-gobject
      - python3-i3ipc
      - python3-build
      - python3-installer
      - python3-wheel
      - python3-setuptools
      # Phase 3a — GUI apps, all native repo-based (no AppImage extract here)
      - chromium                # Fedora base
      - browserpass             # Fedora base — pass integration for browsers
      - browserpass-chromium    # Fedora base
      - zen-browser             # sneexy/zen-browser COPR
      - helium-browser-bin      # Terra (already enabled)
      - zed                     # che/zed COPR — code editor
      # Phase 3b — vendor yum repos
      - beekeeper-studio        # rpm.beekeeperstudio.io vendor repo
      # Phase 3c — Fedora base CLI essentials baked
      - postgresql              # provides psql + client tools (Fedora base)
      - wtype                   # Wayland keyboard input helper (Fedora base)
      # Screenshot stack — required for the niri keybind that pipes a region
      # capture into satty (annotation tool, user-scope via dotfiles GH release).
      # grim/slurp are stable Fedora-base tooling needed by every Wayland
      # screenshot pipeline, so they bake; satty is the polish layer and lives
      # in dotfiles. See RECIPE.md.
      - grim                    # Wayland screenshot capture (Fedora base)
      - slurp                   # Wayland region selector (Fedora base)
      # NOT baked (per user, out of scope for image):
      #   bruno      — ships only aarch64 RPM for Linux; x86_64 is .deb/.AppImage only
      #   localsend  — ships no RPM; .deb/.AppImage/.tar.gz only
      #   polypane   — no RPM
      #   obsidian   — alxhr0/Obsidian COPR dead; user prefers toolbox over baking
      # All four live in user's distrobox toolbox setup (out of scope of this repo).

  # ---------------------------------------------------------------------------
  # nwg-displays (Phase 2.5) — GTK3 output GUI for niri/Hyprland/sway.
  # Installed from upstream tarball rather than COPR because tofik/nwg-shell
  # is stuck on v0.3.28 (pre-niri); 0.4.x added niri detection via
  # NIRI_SOCKET. install.sh writes only to atomic-safe paths.
  # Runtime + build deps are in the rpm-ostree install list above.
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - install-nwg-displays-latest.sh

