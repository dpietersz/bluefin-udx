# bluefin-udx — shared module set
# Included by recipes/bluefin-udx.yml and recipes/bluefin-udx-nvidia.yml.
# Phase 0 scope: only bootstrap-critical packages + Microsoft Teams.
# Later phases will add system tools (Phase 2), GUI apps (Phase 3), and
# Playwright system deps (Phase 3.5). See RECIPE.md for the package manifest.

modules:
  # ---------------------------------------------------------------------------
  # Bootstrap-critical packages.
  # These guarantee the dotfiles SSH/GPG/password-store decryption chain works
  # on first boot of a fresh machine, without requiring rpm-ostree layering from
  # chezmoi. Order of operations on a fresh machine:
  #   1. Install vanilla Bluefin DX from USB
  #   2. sudo bootc switch ghcr.io/dpietersz/bluefin-udx[-nvidia]:stable
  #   3. reboot
  #   4. chezmoi apply  (decrypts keys, clones password-store — all binaries below
  #                     are already on PATH, no rpm-ostree calls needed)
  # ---------------------------------------------------------------------------
  - type: rpm-ostree
    repos:
      # Microsoft Teams (unofficial maintained client, supports Wayland screen share
      # via PipeWire portal — the whole reason this repo exists).
      # See: https://github.com/IsmaelMartinez/teams-for-linux
      - https://repo.teamsforlinux.de/rpm/teams-for-linux.repo
    keys:
      # GPG key for the teams-for-linux RPM repo. Without this, rpm-ostree
      # refuses the package: "could not be verified".
      - https://repo.teamsforlinux.de/teams-for-linux.asc
    install:
      # bootstrap-critical: dotfiles assumes these are present at first apply
      - pass
      - gnupg2
      - age
      - openssh-clients
      - git
      - jq
      - curl
      # GUI app — bake reason: screen sharing reliability on Wayland; distrobox
      # path was unreliable. See RECIPE.md.
      - teams-for-linux

  # ---------------------------------------------------------------------------
  # Teams Wayland integration patch.
  # Rewrites the upstream .desktop Exec line to enable PipeWire screen capture
  # and seeds a default config on first launch. Ported verbatim from boxkit
  # browser-toolbox.sh (battle-tested logic — don't re-derive).
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - teams-wayland-patch.sh

  # ---------------------------------------------------------------------------
  # Paseo desktop (https://paseo.sh).
  # No vendor yum repo and asset filenames embed the version, so we resolve
  # the latest x86_64 RPM from the GitHub release API at image build time.
  # Every image rebuild = freshest Paseo. CLI counterpart (@getpaseo/cli) is
  # installed per-user via chezmoi (run_onchange_after_18-install-paseo-cli).
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - install-paseo-latest.sh

  # ---------------------------------------------------------------------------
  # Proton Authenticator.
  # Proton publishes an official Fedora/RHEL x86_64 RPM but no DNF repository,
  # so install-proton-authenticator-latest.sh resolves the newest active stable
  # release from Proton's version.json, verifies its published SHA-512 digest,
  # validates the RPM identity, and installs it. CI writes the resolved version,
  # URL, and checksum into build-pins.env so an upstream release invalidates the
  # cached build layer. Shared here so both Intel and NVIDIA images ship it.
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - install-proton-authenticator-latest.sh

  # ---------------------------------------------------------------------------
  # Client-side cosign verification for ghcr.io/dpietersz/* images.
  # Wires policy.json + registries.d so `rpm-ostree rebase ostree-image-signed:`
  # validates the image signature before deploying. The ghcr.io/dpietersz
  # namespace hosts images signed by two distinct keys, so the policy entry
  # uses keyPaths (OR semantics):
  #   /usr/lib/pki/containers/bluefin-udx.pub   — bluefin-udx[-nvidia] bootc images
  #   /usr/lib/pki/containers/dpietersz.pub     — boxkit toolboxes
  #                                                (udx-toolbox, playwright-toolbox);
  #                                                vendored from
  #                                                github.com/dpietersz/boxkit/cosign.pub
  # The repo also ships a compat copy at `bluefin-udx-nvidia.pub` so hosts
  # whose /etc/containers/policy.json still references the old keyPath
  # (from the initial bridge fix) keep verifying across the rename.
  # Pubkeys + registries.d snippet land via the files module above; this script
  # merges the policy.json entry (the only piece that can't be a static overlay
  # without clobbering upstream Bluefin entries).
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - install-cosign-policy.sh

  # ---------------------------------------------------------------------------
  # PHASE 2 — system packages migrated out of dotfiles/.chezmoiscripts/
  # Replaces:
  #   02-install-kitty   tmux   nushell
  #   00b-install-polkit-agent (mate-polkit)
  #   01a-install-syncthing
  #   04-install-niri  (niri + waybar + supporting tools, via yalter/niri COPR)
  #   02-install-espanso (espanso-wayland via Terra)
  #   11-install-hyprlock-stack (hyprlock from Terra, swayidle from Fedora)
  #   05-install-noctalia (noctalia-shell-v5 from lionheartp/Hyprland COPR)
  # ---------------------------------------------------------------------------
  - type: rpm-ostree
    repos:
      # Terra (espanso-wayland, hyprlock, helium-browser-bin) is NOT fetched
      # over the network here — repos.fyralabs.com had a multi-hour outage on
      # 2026-06-03 that killed the build mid-rpm-ostree (key.asc 30s timeout).
      # Ship our own terra.repo at files/system/etc/yum.repos.d/terra.repo
      # which uses tetsudou.fyralabs.com metalink (mirror redundancy) and
      # points gpgkey= at a baked key under /etc/pki/rpm-gpg/. The file is
      # placed by the `files` module which runs before rpm-ostree, so the
      # repo is already on disk when this step runs.
      # niri compositor + supporting tools
      - https://copr.fedorainfracloud.org/coprs/yalter/niri/repo/fedora-%OS_VERSION%/yalter-niri-fedora-%OS_VERSION%.repo
      # noctalia-shell-v5
      - https://copr.fedorainfracloud.org/coprs/lionheartp/Hyprland/repo/fedora-%OS_VERSION%/lionheartp-Hyprland-fedora-%OS_VERSION%.repo
      # nushell (Phase 2.5) — replaces the Homebrew-managed nushell as the
      # system shell. Shells are system-integration-sensitive (PAM,
      # /etc/shells, terminal launcher) and brew-managed paths are awkward
      # for default shells, so we bake.
      - https://copr.fedorainfracloud.org/coprs/atim/nushell/repo/fedora-%OS_VERSION%/atim-nushell-fedora-%OS_VERSION%.repo
      # swayosd (Phase 2.5) — OSD for volume/brightness/caps-lock under niri,
      # part of the WM stack per AGENTS.md.
      - https://copr.fedorainfracloud.org/coprs/celestelove/SwayOSD/repo/fedora-%OS_VERSION%/celestelove-SwayOSD-fedora-%OS_VERSION%.repo
      # NOTE: Obsidian deferred to Phase 3b — alxhr0/Obsidian COPR was 404 as
      # of 2026-05-22 (GPG pubkey URL returns 404). Will install via AppImage
      # extract in Phase 3b alongside Polypane.
      #
      # Zen Browser (Phase 3a) — community COPR, auto-rebuilt from upstream
      # Zen release binaries. Fallback: firminunderscore/zen-browser.
      - https://copr.fedorainfracloud.org/coprs/sneexy/zen-browser/repo/fedora-%OS_VERSION%/sneexy-zen-browser-fedora-%OS_VERSION%.repo
      # Zed editor (Phase 3c) — sourced from Terra (already enabled above for
      # espanso-wayland/hyprlock/helium-browser-bin), NOT a dedicated COPR.
      # History: we used the che/zed COPR until 2026-06-14. Both Terra and
      # che/zed ship a package literally named `zed`, so dnf resolved the
      # install to whichever had the higher version. Terra's `zed` is
      # zfs-collision-aware — it carries `Requires: (zed-cli-compat-zfs if zfs
      # else zed-cli)`, so on a zfs-shipping base (bluefin-dx does) the editor
      # binary lands at /usr/bin/zeditor and /usr/bin/zed stays owned by the
      # zfs package (the ZFS Event Daemon). che/zed's `zed` is monolithic: it
      # claims /usr/bin/zed *and* dev.zed.Zed.desktop/metainfo. While che/zed
      # trailed Terra in version it lost the dnf race and builds passed; once
      # che/zed published 1.6.3 (> Terra 1.5.5) it won every resolution and the
      # transaction died on a 3-way file conflict (editor /usr/bin/zed vs zfs,
      # plus .desktop/.metainfo vs Terra's zed-cli-compat-zfs). Dropping the
      # COPR removes the second, redundant zed source entirely so Terra is the
      # sole, version-coherent provider. One fewer independent upstream that can
      # bump out from under the nightly build. See RECIPE.md zed row.
      # Beekeeper Studio (Phase 3b) — NOT loaded from vendor URL because
      # the upstream .repo file at rpm.beekeeperstudio.io/beekeeper-studio.repo
      # points gpgkey= at a *signature file* (repomd.xml.asc) rather than a
      # public key, so rpm-ostree refuses with "Public key not found".
      # Corrected .repo file + baked GPG key are shipped via
      # files/system/etc/yum.repos.d/beekeeper-studio.repo and
      # files/system/etc/pki/rpm-gpg/RPM-GPG-KEY-beekeeper-studio so the
      # build does not depend on rpm.beekeeperstudio.io being up.
    keys: []
    install:
      # Fedora base repos
      - kitty
      - tmux
      - kanshi              # Phase 2.5 — Wayland output config daemon for niri
      - mate-polkit
      - syncthing
      - swayidle
      # niri COPR
      - niri
      - waybar
      - pavucontrol
      - NetworkManager-tui
      - blueman
      - SwayNotificationCenter   # binary: swaync
      # Terra
      - espanso-wayland
      - hyprlock
      # lionheartp/Hyprland COPR
      - noctalia-shell-v5
      # Phase 2.5 COPRs
      - nushell
      - swayosd
      # nwg-displays runtime + build deps (the package itself is installed
      # from upstream tarball via install-nwg-displays-latest.sh below —
      # COPR tofik/nwg-shell is stuck on v0.3.28 which predates niri support).
      # gtk3, gtk-layer-shell, python3-gobject, python3-i3ipc are already
      # pulled by other Phase 2 packages; listed here for explicit guarantee.
      - gtk3
      - gtk-layer-shell
      - python3-gobject
      - python3-i3ipc
      - python3-build
      - python3-installer
      - python3-wheel
      - python3-setuptools
      # Phase 3a — GUI apps, all native repo-based (no AppImage extract here)
      - chromium                # Fedora base
      - browserpass             # Fedora base — pass integration for browsers
      - browserpass-chromium    # Fedora base
      - zen-browser             # sneexy/zen-browser COPR
      - helium-browser-bin      # Terra (already enabled)
      - zed                     # Terra — code editor (binary: zeditor; see repo comment)
      # Phase 3b — vendor yum repos
      - beekeeper-studio        # rpm.beekeeperstudio.io vendor repo
      # Phase 3c — Fedora base CLI essentials baked
      - postgresql              # provides psql + client tools (Fedora base)
      - wtype                   # Wayland keyboard input helper (Fedora base)
      # Screenshot stack — required for the niri keybind that pipes a region
      # capture into satty (annotation tool, user-scope via dotfiles GH release).
      # grim/slurp are stable Fedora-base tooling needed by every Wayland
      # screenshot pipeline, so they bake; satty is the polish layer and lives
      # in dotfiles. See RECIPE.md.
      - grim                    # Wayland screenshot capture (Fedora base)
      - slurp                   # Wayland region selector (Fedora base)
      # wl-mirror — Wayland output mirror client (wlr-screencopy /
      # ext-image-copy-capture, same screencopy family as grim above). niri has
      # no native output mirroring, so dotfiles' niri-mirror-toggle (Ctrl+Alt+M)
      # drives wl-mirror to clone the internal panel onto an external output.
      # Host-native here so mirroring no longer depends on the Arch udx-toolbox
      # being up; the toggle script already prefers a host binary and only falls
      # back to the toolbox. Fedora base (wl-mirror 0.18.5-1.fc44), no new repo.
      - wl-mirror               # Wayland output mirror client (Fedora base)
      # NOT baked (per user, out of scope for image):
      #   bruno      — ships only aarch64 RPM for Linux; x86_64 is .deb/.AppImage only
      #   localsend  — ships no RPM; .deb/.AppImage/.tar.gz only
      #   polypane   — no RPM
      #   obsidian   — alxhr0/Obsidian COPR dead; user prefers toolbox over baking
      # All four live in user's distrobox toolbox setup (out of scope of this repo).

  # ---------------------------------------------------------------------------
  # Phase 3d — OBS Studio + v4l2loopback (virtual camera).
  #
  # v4l2loopback (kernel module for the OBS virtual camera, exposing a
  # /dev/video* device to Teams/Zoom/Slack): NOT layered here. The base
  # `bluefin-dx` / `bluefin-dx-nvidia-open` images already ship
  # `kmod-v4l2loopback`, pre-built and signed with the `ublue kernel` MOK
  # key (already enrolled on the host, so it loads under Secure Boot).
  # Adding a bluebuild `akmods` module on top fails with
  # "cannot install both kmod-v4l2loopback ... from @commandline and ...
  #  from @System" — verified empirically 2026-05-30.
  #
  # Do NOT add `akmod-v4l2loopback` from RPM Fusion as a "fix" — that's
  # the unsigned, build-at-boot source-akmod which silently fails to load
  # under Secure Boot.
  #
  # NVENC is compiled into RPM Fusion's `obs-studio` (used by the P14s NVIDIA
  # dGPU). VAAPI is a SEPARATE Fedora-repo package (`obs-studio-plugin-vaapi`)
  # — required for the T580's Intel iGPU hardware encoder. Both shipped so
  # one image serves both laptops; per-machine encoder selection is in
  # dotfiles via chezmoi templates.
  #
  # Module autoload + `exclusive_caps=1` (needed by Chromium-family apps —
  # Teams, Zoom web — to see the virtual camera) are dropped via
  # files/system/etc/modules-load.d/ and files/system/etc/modprobe.d/.
  #
  # User-layer config (portal config, OBS profile, mic filter chain,
  # plugin pack) lives in dotfiles. See RECIPE.md.
  # ---------------------------------------------------------------------------
  - type: rpm-ostree
    install:
      - obs-studio
      - obs-studio-plugin-vaapi
      - v4l-utils               # v4l2-ctl CLI — debug/inspect v4l2 devices
      - mediainfo               # readable codec/container/color-range inspection
                                # for OBS recording verification (runbook ref)

  # ---------------------------------------------------------------------------
  # Phase 3e — showmethekey (Wayland keystroke visualizer for OBS recordings).
  #
  # Modern replacement for wshowkeys (all forks dead as of late 2025) and
  # screenkey (X11-only). GTK4 overlay, reads /dev/input/event* via libinput
  # directly, so compositor-agnostic and works on niri without layer-shell
  # special-casing. Access to /dev/input is gated by a polkit rule shipped
  # in the RPM (so no input-group membership trap on the host).
  #
  # COPR `pesader/showmethekey` is the endorsed Fedora path. Verified
  # 2026-05-30 that fedora-44 has built RPMs at v1.17.0-2. This pre-dates
  # the v1.19.0 polkit hardening that narrowed the allow rule to
  # local-active-session only; on these single-user laptops the broader
  # 1.17.0 rule is acceptable (no second local account exists to abuse it).
  # Revisit if pesader bumps to >=1.19.0 — RECIPE.md row tracks the version.
  #
  # The COPR .repo file declares `gpgkey=` so dnf fetches the key at install
  # time; no separate `keys:` entry needed (matches existing niri / Hyprland
  # / zen-browser COPRs above).
  #
  # Startup invocation (`spawn-at-startup "showmethekey-gtk" "-kAC"`) and
  # any toggle keybind live in dotfiles' niri/config.kdl.tmpl — this image
  # only provides the binary + polkit rule.
  # ---------------------------------------------------------------------------
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/pesader/showmethekey/repo/fedora-%OS_VERSION%/pesader-showmethekey-fedora-%OS_VERSION%.repo
    install:
      - showmethekey

  # ---------------------------------------------------------------------------
  # nwg-displays (Phase 2.5) — GTK3 output GUI for niri/Hyprland/sway.
  # Installed from upstream tarball rather than COPR because tofik/nwg-shell
  # is stuck on v0.3.28 (pre-niri); 0.4.x added niri detection via
  # NIRI_SOCKET. install.sh writes only to atomic-safe paths.
  # Runtime + build deps are in the rpm-ostree install list above.
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - install-nwg-displays-latest.sh

  # ---------------------------------------------------------------------------
  # Fontconfig cache rebuild (build-time, best-effort).
  # Run after all common font-bearing packages/apps are layered. The base image's
  # baked cache can miss late-added fonts (notably Noto Color Emoji COLRv1), and
  # ostree epoch-normalized font-dir mtimes can stop runtime lazy rescans from
  # detecting the gap. Force one system cache rebuild here so Chromium-family and
  # GTK fontconfig clients resolve emoji correctly on first boot.
  #
  # NOTE: this build-time pass is NOT sufficient on its own — ostree/composefs
  # gives /usr/share/fonts an epoch checksum at runtime. If any fc-cache runs
  # while that dir isn't fully materialized it writes a valid-but-EMPTY cache
  # that validates forever, hiding the real serif fonts so Chromium/Electron fall
  # to a Nerd Font for `serif` (monospace digits + wrong serif + tofu). The
  # system-cache half is the guarded fc-cache-boot.service below; the
  # authoritative repair is the user-scope verify-and-heal in dotfiles
  # (refresh-fontconfig-cache.service -> ~/.local/bin/scripts/fontconfig-heal.sh),
  # which rebuilds ~/.cache until real fonts are visible and survives both image
  # updates and chezmoi apply.
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - rebuild-font-cache.sh

  # ---------------------------------------------------------------------------
  # Enable the boot-time fontconfig cache rebuild.
  # Unit + cachedir conf + tmpfiles dir ship via the `files` module
  # (files/system/...). The service does a guarded `fc-cache --force` into
  # /var/cache/fontconfig early at every boot, Before=display-manager.service: it
  # verifies a canary font is visible afterward and DELETES the cache if the scan
  # came up empty, so it can never publish a poisoned valid-empty cache (the bug
  # the old `--system-only` variant caused). See the unit header and
  # files/system/etc/fonts/conf.d/05-bluefin-writable-cache.conf.
  # ---------------------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - fc-cache-boot.service

