# bluefin-udx — shared module set
# Included by recipes/bluefin-udx.yml and recipes/bluefin-udx-nvidia.yml.
# Phase 0 scope: only bootstrap-critical packages + Microsoft Teams.
# Later phases will add system tools (Phase 2), GUI apps (Phase 3), and
# Playwright system deps (Phase 3.5). See RECIPE.md for the package manifest.

modules:
  # ---------------------------------------------------------------------------
  # Bootstrap-critical packages.
  # These guarantee the dotfiles SSH/GPG/password-store decryption chain works
  # on first boot of a fresh machine, without requiring rpm-ostree layering from
  # chezmoi. Order of operations on a fresh machine:
  #   1. Install vanilla Bluefin DX from USB
  #   2. sudo bootc switch ghcr.io/dpietersz/bluefin-udx[-nvidia]:stable
  #   3. reboot
  #   4. chezmoi apply  (decrypts keys, clones password-store — all binaries below
  #                     are already on PATH, no rpm-ostree calls needed)
  # ---------------------------------------------------------------------------
  - type: rpm-ostree
    repos:
      # Microsoft Teams (unofficial maintained client, supports Wayland screen share
      # via PipeWire portal — the whole reason this repo exists).
      # See: https://github.com/IsmaelMartinez/teams-for-linux
      - https://repo.teamsforlinux.de/rpm/teams-for-linux.repo
    keys:
      # GPG key for the teams-for-linux RPM repo. Without this, rpm-ostree
      # refuses the package: "could not be verified".
      - https://repo.teamsforlinux.de/teams-for-linux.asc
    install:
      # bootstrap-critical: dotfiles assumes these are present at first apply
      - pass
      - gnupg2
      - age
      - openssh-clients
      - git
      - jq
      - curl
      # GUI app — bake reason: screen sharing reliability on Wayland; distrobox
      # path was unreliable. See RECIPE.md.
      - teams-for-linux

  # ---------------------------------------------------------------------------
  # Teams Wayland integration patch.
  # Rewrites the upstream .desktop Exec line to enable PipeWire screen capture
  # and seeds a default config on first launch. Ported verbatim from boxkit
  # browser-toolbox.sh (battle-tested logic — don't re-derive).
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - teams-wayland-patch.sh

  # ---------------------------------------------------------------------------
  # PHASE 2 — system packages migrated out of dotfiles/.chezmoiscripts/
  # Replaces:
  #   02-install-kitty   tmux   nushell
  #   00b-install-polkit-agent (mate-polkit)
  #   01a-install-syncthing
  #   04-install-niri  (niri + waybar + supporting tools, via yalter/niri COPR)
  #   02-install-espanso (espanso-wayland via Terra)
  #   11-install-hyprlock-stack (hyprlock from Terra, swayidle from Fedora)
  #   05-install-noctalia (noctalia-shell-v5 from lionheartp/Hyprland COPR)
  # ---------------------------------------------------------------------------
  - type: rpm-ostree
    repos:
      # Terra — espanso-wayland and hyprlock live here. The Terra RPM ships
      # CAP_DAC_OVERRIDE pre-set on espanso, so no separate setcap module.
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      # niri compositor + supporting tools
      - https://copr.fedorainfracloud.org/coprs/yalter/niri/repo/fedora-%OS_VERSION%/yalter-niri-fedora-%OS_VERSION%.repo
      # noctalia-shell-v5
      - https://copr.fedorainfracloud.org/coprs/lionheartp/Hyprland/repo/fedora-%OS_VERSION%/lionheartp-Hyprland-fedora-%OS_VERSION%.repo
      # nushell (Phase 2.5) — replaces the Homebrew-managed nushell as the
      # system shell. Shells are system-integration-sensitive (PAM,
      # /etc/shells, terminal launcher) and brew-managed paths are awkward
      # for default shells, so we bake.
      - https://copr.fedorainfracloud.org/coprs/atim/nushell/repo/fedora-%OS_VERSION%/atim-nushell-fedora-%OS_VERSION%.repo
      # swayosd (Phase 2.5) — OSD for volume/brightness/caps-lock under niri,
      # part of the WM stack per AGENTS.md.
      - https://copr.fedorainfracloud.org/coprs/celestelove/SwayOSD/repo/fedora-%OS_VERSION%/celestelove-SwayOSD-fedora-%OS_VERSION%.repo
    install:
      # Fedora base repos
      - kitty
      - tmux
      - kanshi              # Phase 2.5 — Wayland output config daemon for niri
      - mate-polkit
      - syncthing
      - swayidle
      # niri COPR
      - niri
      - waybar
      - pavucontrol
      - NetworkManager-tui
      - blueman
      - SwayNotificationCenter   # binary: swaync
      # Terra
      - espanso-wayland
      - hyprlock
      # lionheartp/Hyprland COPR
      - noctalia-shell-v5
      # Phase 2.5 COPRs
      - nushell
      - swayosd

