# vitta-nvidia — personal niri desktop for the ThinkPad P14s hybrid GPU.
# base-nvidia was retired upstream. BlueBuild's akmods module adds the NVIDIA
# open driver to base-main and writes its required bootc kernel arguments.
# CUDA toolkit stays out of the image: see recipes/bluefin-udx-nvidia.yml for
# the atomic-filesystem rationale and the per-project container workflow.

name: vitta-nvidia
description: Vitta — personal niri desktop on Universal Blue base-main with NVIDIA
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /
  - from-file: common.yml
  # Vitta-only: files/vitta overlay + what bluefin-dx used to supply (keyring,
  # portals, brew, docker, libvirt, tailscale, VS Code, v4l2loopback).
  - from-file: vitta-modules.yml

  # Pulls akmods-nvidia-open and installs the driver stack, services, dracut
  # force_drivers and /usr/lib/bootc/kargs.d/00-bluebuild-nvidia-kargs.toml.
  # This must precede initramfs so the forced drivers reach the boot image.
  - type: akmods
    install: []
    nvidia-driver: nvidia-open

  - type: rpm-ostree
    install:
      # base-main does not include nvtop; retain the explicit NVIDIA monitoring
      # tool contract.
      - nvtop

  # Keep this after every other module except initramfs: earlier modules and
  # their scripts still see Fedora's identity, while boot entries see Vitta.
  - type: os-release
    properties:
      ID: vitta
      ID_LIKE: fedora
      NAME: "Vitta"
      PRETTY_NAME: "Vitta 44 (NVIDIA)"
      VARIANT_ID: vitta-nvidia
      IMAGE_ID: vitta-nvidia

  # Last on purpose: capture every earlier change, including NVIDIA boot args
  # and the Vitta identity, in the bootc initramfs.
  - type: initramfs
